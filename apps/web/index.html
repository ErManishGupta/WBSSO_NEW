<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Unified Portal Dashboard | West Bengal Labour Department</title>
    <meta
      name="description"
      content="Single Sign-On (SSO) and unified access management dashboard for the Labour Department, Government of West Bengal."
    />
    <!-- Immediate theme restoration script to eliminate flash of unstyled theme (FOUT) -->
    <script>
      (function() {
        try {
          var stored = localStorage.getItem('wb_sso_theme_preference') || localStorage.getItem('wb_sso_theme');
          var isDark = stored === 'dark' || (!stored && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (isDark) {
            document.documentElement.classList.add('dark');
            document.documentElement.setAttribute('data-theme', 'dark');
            document.documentElement.style.colorScheme = 'dark';
          } else {
            document.documentElement.classList.remove('dark');
            document.documentElement.setAttribute('data-theme', 'light');
            document.documentElement.style.colorScheme = 'light';
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-[#F8FAFC] dark:bg-[#070D18] text-[#0F172A] dark:text-[#F8FAFC] min-h-screen antialiased selection:bg-[#FF7A00] selection:text-white transition-colors duration-200">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
